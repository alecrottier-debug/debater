name: Deploy Backend

on:
  push:
    branches: [main]
    paths: [backend/**]
  workflow_dispatch:

# Pushing to GitHub's container registry uses the workflow's own GITHUB_TOKEN, so it
# needs package write access. Declaring permissions sets every unlisted one to none,
# which is the point: nothing else here writes to the repo.
permissions:
  contents: read
  packages: write

env:
  # Lowercase is required by ghcr.io. The repo is public, so the package is public too
  # and the Container App pulls it with no stored credential.
  GHCR_IMAGE: ghcr.io/alecrottier-debug/debater-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name debateracr

      # MIGRATION STEP 1 of 2 (2026-09-21): push to BOTH registries, still deploy from
      # ACR. This run creates the ghcr.io package from this repo's own Actions, which is
      # what lets later runs push to it. Step 2 drops ACR and deploys from ghcr.io.
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t debateracr.azurecr.io/debater-api:${{ github.sha }} -t debateracr.azurecr.io/debater-api:latest \
            -t $GHCR_IMAGE:${{ github.sha }} -t $GHCR_IMAGE:latest \
            ./backend
          docker push debateracr.azurecr.io/debater-api:${{ github.sha }}
          docker push debateracr.azurecr.io/debater-api:latest
          docker push $GHCR_IMAGE:${{ github.sha }}
          docker push $GHCR_IMAGE:latest

      # Migrations run here (once, pre-deploy) instead of on every container start.
      # DATABASE_URL is pulled from the Container App's existing `database-url` secret
      # so we don't have to duplicate it as a GitHub Actions secret.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Fetch DATABASE_URL from Container App
        id: db
        run: |
          DB_URL=$(az containerapp secret show \
            --name debater-api \
            --resource-group debater-prod-rg \
            --secret-name database-url \
            --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run database migrations
        working-directory: backend
        # Neon's serverless Postgres can be slow to acquire advisory locks,
        # which times out `prisma migrate deploy` at the default 10s window.
        # Disabling the lock is safe here: this workflow runs serially from a
        # single branch with concurrency=1, so there are no concurrent migrators.
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: npx prisma migrate deploy --config prisma/prisma.config.ts

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name debater-api \
            --resource-group debater-prod-rg \
            --image debateracr.azurecr.io/debater-api:${{ github.sha }}
