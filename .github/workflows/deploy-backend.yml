name: Deploy Backend

on:
  push:
    branches: [main]
    paths: [backend/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name debateracr

      - name: Build and push Docker image
        run: |
          docker build -t debateracr.azurecr.io/debater-api:${{ github.sha }} -t debateracr.azurecr.io/debater-api:latest ./backend
          docker push debateracr.azurecr.io/debater-api:${{ github.sha }}
          docker push debateracr.azurecr.io/debater-api:latest

      # Migrations run here (once, pre-deploy) instead of on every container start.
      # DATABASE_URL is pulled from the Container App's existing `database-url` secret
      # so we don't have to duplicate it as a GitHub Actions secret.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Fetch DATABASE_URL from Container App
        id: db
        run: |
          DB_URL=$(az containerapp secret show \
            --name debater-api \
            --resource-group debater-rg \
            --secret-name database-url \
            --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run database migrations
        working-directory: backend
        # Neon's serverless Postgres can be slow to acquire advisory locks,
        # which times out `prisma migrate deploy` at the default 10s window.
        # Disabling the lock is safe here: this workflow runs serially from a
        # single branch with concurrency=1, so there are no concurrent migrators.
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: npx prisma migrate deploy --config prisma/prisma.config.ts

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name debater-api \
            --resource-group debater-rg \
            --image debateracr.azurecr.io/debater-api:${{ github.sha }}
