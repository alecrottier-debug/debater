name: iOS CI

on:
  push:
    branches: [main, Dev]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available iPhone | head -20

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project Debater.xcodeproj \
            -scheme Debater \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
            -configuration Debug \
            test | xcbeautify --renderer github-actions || xcodebuild \
              -project Debater.xcodeproj \
              -scheme Debater \
              -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
              -configuration Debug \
              test
