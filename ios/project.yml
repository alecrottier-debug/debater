name: Debater
options:
  bundleIdPrefix: com.debater
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "14"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Debater:
    type: application
    platform: iOS
    sources:
      - path: Debater
        excludes:
          - "**/.DS_Store"
    resources:
      - Debater/Resources/Assets.xcassets
    info:
      path: Debater/Resources/Info.plist
      properties:
        CFBundleDisplayName: AI Debater
        CFBundleName: AI Debater
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read at runtime by AppEnvironment.resolveBaseURL(). Value is
        # interpolated from the active xcconfig's DEBATER_API_URL.
        DEBATER_API_URL: $(DEBATER_API_URL)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debater.app
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
  DebaterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DebaterTests
    dependencies:
      - target: Debater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debater.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Debater:
    build:
      targets:
        Debater: all
        DebaterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DebaterTests
    archive:
      config: Release
